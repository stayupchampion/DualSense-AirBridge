name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.320'
      - name: Build native backend and run native tests
        run: ./scripts/build-backend.ps1 -CMake (Get-Command cmake).Source -Python (Get-Command python).Source
      - name: Build desktop app and run C# checks
        run: ./scripts/build.ps1 -SkipBackend -OutputDirectory '.local/release/app'
      - name: Check backend lifecycle without drivers or hardware
        run: ./scripts/test-backend.ps1
      - name: Ensure generated patch matches committed source
        run: |
          git diff --exit-code -- patches licenses
          if ($LASTEXITCODE -ne 0) { throw 'Generated source or license drift' }
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify source workspace' }
          if ($changes.Count) {
            $changes | Write-Output
            git diff --stat
            throw 'Build left unexpected source workspace changes'
          }
      - name: Package and inspect release
        run: ./scripts/package-release.ps1 -BuildDirectory '.local/release/app' -OutputDirectory '.local/release/assets'
      - name: Publish release with versioned notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content src/DsBridge.App/DsBridge.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match app version' }
          $notes = "docs/releases/v$version.md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Versioned release notes are missing' }
          $assets = @(Get-ChildItem .local/release/assets -File | ForEach-Object FullName)
          $expected = @("DualSense-AirBridge-v$version-win-x64.zip",'SHA256SUMS.txt','build-manifest.json')
          if ($assets.Count -ne $expected.Count) { throw 'Unexpected release asset count' }
          foreach ($name in $expected) {
            if (!(Test-Path -LiteralPath (Join-Path '.local/release/assets' $name))) { throw "Missing release asset: $name" }
          }
          $releaseArgs = @('release','create',$env:RELEASE_TAG) + $assets + @('--verify-tag','--title',"$env:RELEASE_TAG - DualSense AirBridge",'--notes-file',$notes)
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' } else { $releaseArgs += '--latest' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
