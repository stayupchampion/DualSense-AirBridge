name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.320'
      - name: Build native backend and run native tests
        run: ./scripts/build-backend.ps1 -CMake (Get-Command cmake).Source -Python (Get-Command python).Source
      - name: Build desktop app and run C# checks
        run: ./scripts/build.ps1 -SkipBackend -OutputDirectory '.local/release/app'
      - name: Check backend lifecycle without drivers or hardware
        run: ./scripts/test-backend.ps1
      - name: Ensure generated patch matches committed source
        run: |
          git diff --exit-code -- patches licenses
          if ($LASTEXITCODE -ne 0) { throw 'Generated source or license drift' }
      - name: Package and inspect release
        run: ./scripts/package-release.ps1 -BuildDirectory '.local/release/app' -OutputDirectory '.local/release/assets'
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content src/DsBridge.App/DsBridge.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match app version' }
          $assets = @(Get-ChildItem .local/release/assets -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "$env:RELEASE_TAG - First public preview" --notes-file docs/releases/v0.1.4.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
